name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --bin recode
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          pwsh script/bench.ps1 -Runs 20 | Tee-Object -FilePath bench.txt
          Get-Content bench.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
